const GRAV = 0.28, MAXFALL = 6.0;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rectHit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pad2 = n => (n < 10 ? '0' : '') + n;
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); };
const fmtMs = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + pad2(s % 60) + '.' + pad2(Math.floor((ms % 1000) / 10)); };

function makeRng(seed) {
  let a = seed >>> 0;
  const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  return f;
}

/* ---------------- Input ---------------- */
const Input = {
  down: {}, pressed: {}, released: {}, anyPressed: false, lastKey: null, gpPrev: {},
  map: {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
    jump: ['Space', 'KeyW', 'ArrowUp'], run: ['ShiftLeft', 'ShiftRight', 'KeyK'], perk: ['KeyE', 'KeyJ'],
    marx: ['KeyH'], pause: ['Escape', 'KeyP'], ok: ['Enter', 'Space', 'KeyE'], back: ['Escape', 'Backspace'], mute: ['KeyM'],
    one: ['Digit1'], two: ['Digit2'], three: ['Digit3'], four: ['Digit4'], five: ['Digit5'], six: ['Digit6']
  },
  init() {
    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
      if (e.repeat) return;
      if (!this.down[e.code]) { this.pressed[e.code] = true; this.anyPressed = true; this.lastKey = e.code; }
      this.down[e.code] = true;
      AudioSys.resume();
    });
    window.addEventListener('keyup', e => { this.down[e.code] = false; this.released[e.code] = true; });
    window.addEventListener('blur', () => { this.down = {}; });
  },
  pollGamepad() {
    let gps; try { gps = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) { return; }
    const gp = gps && gps[0]; if (!gp) return;
    const b = i => gp.buttons[i] && gp.buttons[i].pressed;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const virt = {
      ArrowLeft: b(14) || ax < -0.5, ArrowRight: b(15) || ax > 0.5, ArrowUp: b(12) || ay < -0.5, ArrowDown: b(13) || ay > 0.5,
      Space: b(0), ShiftLeft: b(2) || b(1), KeyE: b(3), Escape: b(9), Enter: b(0), KeyH: b(4) || b(5)
    };
    for (const k in virt) {
      const v = !!virt[k];
      if (v && !this.gpPrev[k]) { this.pressed[k] = true; this.anyPressed = true; this.down[k] = true; AudioSys.resume(); }
      if (!v && this.gpPrev[k]) { this.released[k] = true; this.down[k] = false; }
      this.gpPrev[k] = v;
    }
  },
  is(action) { return this.map[action].some(c => this.down[c]); },
  was(action) { return this.map[action].some(c => this.pressed[c]); },
  wasReleased(action) { return this.map[action].some(c => this.released[c]); },
  endFrame() { this.pressed = {}; this.released = {}; this.anyPressed = false; }
};

const Font = {
  cache: {}, w: 6, h: 8,
  glyph(ch, color) {
    const key = ch + color;
    if (this.cache[key]) return this.cache[key];
    const src = FONT_SRC[ch] || FONT_SRC['?'];
    const c = document.createElement('canvas'); c.width = 5; c.height = 7;
    const g = c.getContext('2d'); g.fillStyle = color;
    for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (src[y][x] === '#') g.fillRect(x, y, 1, 1);
    this.cache[key] = c; return c;
  },
  width(txt) { return txt.length * this.w - 1; },
  draw(ctx, txt, x, y, color = '#fff', opts = {}) {
    txt = String(txt);
    let cx = x;
    if (opts.align === 'center') cx = Math.round(x - this.width(txt) / 2);
    else if (opts.align === 'right') cx = Math.round(x - this.width(txt));
    cx = Math.round(cx); y = Math.round(y);
    if (opts.shadow) { for (let i = 0; i < txt.length; i++) ctx.drawImage(this.glyph(txt[i], opts.shadow === true ? '#000' : opts.shadow), cx + i * this.w + 1, y + 1); }
    for (let i = 0; i < txt.length; i++) ctx.drawImage(this.glyph(txt[i], color), cx + i * this.w, y);
    return cx + txt.length * this.w;
  },
  // simple word wrap
  wrap(txt, maxChars) {
    const out = [];
    for (const para of String(txt).split('\n')) {
      let line = '';
      for (const word of para.split(' ')) {
        if ((line + ' ' + word).trim().length > maxChars) { out.push(line); line = word; }
        else line = (line ? line + ' ' : '') + word;
      }
      out.push(line);
    }
    return out;
  },
  drawWrapped(ctx, txt, x, y, maxChars, color, lineH = 9, opts = {}) {
    const lines = this.wrap(txt, maxChars);
    lines.forEach((l, i) => this.draw(ctx, l, x, y + i * lineH, color, opts));
    return lines.length;
  },
  // big text: scaled 2x
  drawBig(ctx, txt, x, y, color = '#fff', scale = 2, opts = {}) {
    txt = String(txt);
    const w = txt.length * this.w * scale - scale;
    let cx = x;
    if (opts.align === 'center') cx = Math.round(x - w / 2); else if (opts.align === 'right') cx = Math.round(x - w);
    ctx.imageSmoothingEnabled = false;
    if (opts.shadow) for (let i = 0; i < txt.length; i++) ctx.drawImage(this.glyph(txt[i], '#000'), cx + i * this.w * scale + scale, y + scale, 5 * scale, 7 * scale);
    for (let i = 0; i < txt.length; i++) ctx.drawImage(this.glyph(txt[i], color), cx + i * this.w * scale, y, 5 * scale, 7 * scale);
  }
};

   03 audio: WebAudio Chiptune-Tracker (4 Kanäle) + synthetische SFX
   ===================================================================== */
const NOTE_IDX = { c: 0, 'c#': 1, db: 1, d: 2, 'd#': 3, eb: 3, e: 4, f: 5, 'f#': 6, gb: 6, g: 7, 'g#': 8, ab: 8, a: 9, 'a#': 10, bb: 10, b: 11 };
function noteFreq(n) {
  if (typeof n === 'number') return 440 * Math.pow(2, (n - 69) / 12);
  const m = /^([a-g][#b]?)(-?\d)$/.exec(n); if (!m) return 0;
  const midi = 12 * (parseInt(m[2]) + 1) + NOTE_IDX[m[1]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function midiOf(n) { const m = /^([a-g][#b]?)(-?\d)$/.exec(n); return 12 * (parseInt(m[2]) + 1) + NOTE_IDX[m[1]]; }

const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], mixo: [0, 2, 4, 5, 7, 9, 10], harm: [0, 2, 3, 5, 7, 8, 11], penta: [0, 2, 4, 7, 9], mpenta: [0, 3, 5, 7, 10] };

/* ---- procedural song generator ----
   spec: {bpm, root(midi), scale, prog:[[deg,quality]...] per bar, bars, seed, lead:'sq25'|'sq50'|'sq12', bass:'walk'|'oct'|'pump'|'dub'|'waltz'|'polka',
          drums:'rock'|'ska'|'bossa'|'polka'|'dub'|'waltz'|'none'|'four'|'march', density:0..1, melody:[optional handwritten tokens per step], swing }
   Output: {bpm, steps(per bar 16 or 12), ch:[{wave, vol, pat:[...]}], stepsTotal}
*/
function chordTones(root, scale, deg) {
  const sc = SCALES[scale]; const n = sc.length;
  const t = i => root + sc[(deg + i) % n] + 12 * Math.floor((deg + i) / n);
  return [t(0), t(2), t(4)];
}
function generateSong(spec) {
  const rng = makeRng(spec.seed || 1);
  const stepsPerBar = spec.steps || 16, bars = spec.bars || 8;
  const total = stepsPerBar * bars;
  const sc = SCALES[spec.scale || 'major'];
  const lead = [], harm = [], bass = [], drums = [], arp = [];
  const prog = spec.prog || [0, 5, 3, 4];
  const dens = spec.density == null ? 0.6 : spec.density;
  // motif: rhythmic template for 1 bar, reused with variation
  const motifLen = stepsPerBar;
  const baseRhythm = [];
  for (let s = 0; s < motifLen; s++) {
    const strong = s % 4 === 0, mid = s % 2 === 0;
    baseRhythm.push(strong ? rng() < 0.9 : mid ? rng() < dens : rng() < dens * 0.45);
  }
  let curDeg = 0; let lastNote = spec.root + 12;
  const scaleNote = (idx) => { const n = sc.length; return spec.root + 12 + sc[((idx % n) + n) % n] + 12 * Math.floor(idx / n); };
  const nearestScaleIdx = (midi) => { let best = 0, bd = 99; for (let i = -7; i < 21; i++) { const d = Math.abs(scaleNote(i) - midi); if (d < bd) { bd = d; best = i; } } return best; };
  let idx = nearestScaleIdx(lastNote);
  for (let b = 0; b < bars; b++) {
    const chord = prog[b % prog.length]; const tones = chordTones(spec.root, spec.scale || 'major', chord);
    const isLast = (b % 4 === 3);
    for (let s = 0; s < stepsPerBar; s++) {
      const g = b * stepsPerBar + s;
      // lead
      let hit = baseRhythm[s] && (!isLast || s < stepsPerBar - 4 || rng() < 0.5);
      if (spec.melody) { const tok = spec.melody[g % spec.melody.length]; lead.push(tok); }
      else if (hit) {
        // choose next idx: chord tone on strong beats
        if (s % 4 === 0 || rng() < 0.4) {
          const want = rng.pick(tones) + 12 + (rng() < 0.3 ? 12 : 0);
          const ni = nearestScaleIdx(want);
          idx = Math.abs(ni - idx) > 5 ? idx + sign(ni - idx) * rng.int(1, 3) : ni;
        } else idx += rng.pick([-2, -1, -1, 1, 1, 2]);

    this.hitWall = false;
    this.x += this.vx;
    if (this.vx !== 0) {
      const dirx = this.vx > 0 ? 1 : -1;

          if (s === 1 && this.groundTile !== '-') { /* ok */ }
        }
      }
      if (landed) this.groundTile = this.groundTile || '#';
    } else {
      const ty = Math.floor(this.y / TILE);
      const x0 = Math.floor((this.x + 2) / TILE), x1 = Math.floor((this.right - 2.01) / TILE);

      else if (ch === 'I') { if (this.blockState[tx + ',' + ty] !== 'shown') continue; img = Tiles.img('I', 'shown'); }
      else if (ch === 'c') { const sp = this.specials[tx + ',' + ty]; if (sp && sp.label) { g.fillStyle = '#c9ccd2'; g.fillRect(tx * TILE, ty * TILE, 16, 16); g.fillStyle = '#4c4c56'; g.fillRect(tx * TILE, ty * TILE, 16, 1); g.fillRect(tx * TILE, ty * TILE, 1, 16); Font.draw(g, sp.label, tx * TILE + 8, ty * TILE + 4, sp.sys && sp.sys.nums[sp.sys.next] === +sp.label && Game.frame % 30 < 15 ? '#e03a3a' : '#101014', { align: 'center' }); continue; } else continue; }
      else if (ch === 'p' || ch === 'u' || ch === 'o' || ch === 'd' || ch === '|') continue;
      else img = Tiles.img(ch, ch === '?' || ch === 'Q' || ch === 'Y' ? (Game.frame % 40 < 20 ? 'lit' : '') : '');
      if (ch === 'Y') img = Tiles.img('?', Game.frame % 40 < 20 ? 'lit' : '');
      let oy = 0; if (this.bumpAnim && this.bumpAnim.tx === tx && this.bumpAnim.ty === ty) oy = -Math.sin(this.bumpAnim.t / 10 * Math.PI) * 5;
      if (ch === '~' || ch === '!') { g.globalAlpha = ch === '~' ? 0.75 : 1; g.drawImage(img, tx * TILE, ty * TILE + (ch === '!' ? Math.sin(Game.frame * 0.1 + tx) * 1.5 : 0)); g.globalAlpha = 1; }
      else g.drawImage(img, tx * TILE, ty * TILE + oy);
    }
    // pipes
    for (const pp of this.pipes) { if (pp.x + 32 < camX || pp.x > camX + VW) continue; Tiles.drawPipe(g, pp.x, pp.y, pp.h, pp.color, pp.dir); }
    // entities by layer
    const vis = this.ents.filter(e => !e.dead && e.active && e.x + e.w >= camX - 64 && e.x <= camX + VW + 64 && e.y + e.h >= camY - 64 && e.y <= camY + VH + 64);
    const layers = [[], [], [], [], []]; for (const e of vis) layers[e.type === 'player' ? 2 : e.layer === undefined ? 1 : Math.min(4, e.layer)].push(e);
    // background-ish entities first
    const order = ['checkpoint', 'end', 'marx', 'door', 'plat', 'hotspot', 'tisch', 'buchse', 'zoll', 'sign', 'npc', 'kessel', 'numbtn'];
    layers[1].sort((a, b) => (order.indexOf(a.type) >= 0 ? 0 : 1) - (order.indexOf(b.type) >= 0 ? 0 : 1));

    for (const e of vis) if (e.draw2) e.draw2(g);
    if (this.boss && !this.boss.dead) this.boss.drawHp(g);
    g.restore();
    if (off) { g.fillStyle = 'rgba(80,80,90,0.35)'; g.fillRect(0, 0, VW, VH); }

/* ---------- Assembler ---------- */
function assemble(seq, opts = {}) {
  const rows = Array.from({ length: 15 }, () => ''); const ents = []; const offline = []; const polls = []; const wartes = []; const tickets = []; const pipePlan = [];
  let x = 0, pollIdx = 0;
  for (const item of seq) {
    const name = typeof item === 'string' ? item : item.c; const c = CH[name]; if (!c) throw new Error('unknown chunk ' + name);
    const rep = (typeof item === 'object' && item.rep) || 1;
    for (let r = 0; r < rep; r++) {
      for (let y = 0; y < 15; y++) rows[y] += c.rows[y];
      if (c.offline) offline.push({ id: 'z' + offline.length, x0: x, x1: x + c.w - 1, range: c.range || 150 });
      if (c.poll) { const p = (typeof item === 'object' && item.poll) || (opts.polls && opts.polls[pollIdx]) || null; polls.push({ x, y: 0, def: p }); pollIdx++; }
      if (c.warte) wartes.push({ x });
      if (c.ticket) tickets.push({ x });
      if (c.pipes) pipePlan.push({ x0: x, x1: x + c.w, tags: c.pipes.slice() });
      const sfx = (e) => { const o = Object.assign({}, e, { x: e.x + x }); if (o.id) o.id = o.id + '@' + x; if (o.door) o.door = o.door + '@' + x; if (o.cells) o.cells = o.cells.map(cc => [cc[0] + x, cc[1]]); return o; };
      if (c.ents) for (const e of c.ents) ents.push(sfx(e));
      if (typeof item === 'object' && item.ents) for (const e of item.ents) ents.push(sfx(e));
      x += c.w;
    }
  }
  const map = rows.map(r => r.split(''));
  for (let y = 0; y < 15; y++) for (let xx = 0; xx < map[0].length; xx++) {
    const ch = map[y][xx];
    if ((ch === '{' || ch === '}') && (y === 0 || map[y - 1][xx] !== ch)) {
      let h = 1; while (y + h < 15 && map[y + h][xx] === ch) h++;
      const poll = polls.find(p => xx >= p.x && xx < p.x + 40); const id = (poll ? 'poll' + polls.indexOf(poll) : 'poll') + (ch === '{' ? 'A' : 'B');
      ents.push({ t: 'door', x: xx, y, id, h: h * TILE, hint: 'Der Chat entscheidet!' });
      for (let k = 0; k < h; k++) map[y + k][xx] = '.';
    }
  }
  for (const p of polls) { const i = polls.indexOf(p); ents.push({ t: 'poll', x: p.x + 1, y: 0, idx: i, A: (p.def && p.def.A) || 'Oben: Bits & Gefahr', B: (p.def && p.def.B) || 'Unten: sicher', doorA: 'poll' + i + 'A', doorB: 'poll' + i + 'B' }); }
  for (const w of wartes) {
    const cells = []; for (let y = 0; y < 15; y++) for (let xx = w.x; xx < w.x + 32; xx++) if (map[y][xx] === 'c') cells.push([xx, y]);
    cells.sort((a, b) => a[0] - b[0]); const nums = [47, 48, 49, 50].slice(0, cells.length);
    ents.push({ t: 'warte', x: 0, y: 0, cells, nums, door: 'warte' + wartes.indexOf(w) });
    ents.push({ t: 'door', x: w.x + 30, y: 3, id: 'warte' + wartes.indexOf(w), h: 160, hint: 'Wartenummern in Reihenfolge anstoßen: 47, 48, 49, 50' });
  }
  for (const t of tickets) { ents.push({ t: 'tdoor', x: t.x + 28, y: 3, id: 't' + tickets.indexOf(t), h: 160 }); }
  return { map: map.map(r => r.join('')), ents, offline, pipePlan };
}
/* vertical tower generator (w8) */
function genTower(seed, height, opts = {}) {
  const rng = makeRng(seed); const W = 20; const rows = []; for (let y = 0; y < height; y++) rows.push('%' + '.'.repeat(W - 2) + '%');
  const set = (x, y, ch) => { if (y >= 0 && y < height && x > 0 && x < W - 1) rows[y] = rows[y].slice(0, x) + ch + rows[y].slice(x + 1); };
  // floor
  for (let x = 0; x < W; x++) set(x, height - 1, '#'), set(x, height - 2, '#');
  let y = height - 5, side = 0, n = 0;
  const ents = [];
  // start platform row: wide, safe
  for (let x = 1; x < W - 1; x++) set(x, height - 3, '.');
  let prevX0 = 1, prevX1 = W - 2;
  while (y > 7) {
    let w = rng.int(5, 8), x0, x1;
    if (side === 0) { x0 = rng.int(1, 3); x1 = x0 + w - 1; if (prevX0 - x1 > 4) x1 = prevX0 - 4; }
    else { x1 = W - 2 - rng.int(0, 2); x0 = x1 - w + 1; if (x0 - prevX1 > 4) x0 = prevX1 + 4; }
    w = x1 - x0 + 1;
    for (let x = x0; x <= x1; x++) set(x, y, opts.solid ? '=' : '-');
    prevX0 = x0; prevX1 = x1;
    const r = rng();
    if (r < 0.18 && n > 2) set(x0 + Math.floor(w / 2), y - 1, opts.enemies ? rng.pick(opts.enemies) : 't');
    else if (r < 0.5) { set(x0 + 1, y - 2, 'b'); set(x0 + w - 2, y - 2, 'b'); }
    else if (r < 0.6 && opts.clickbait) { set(x0 + w + 1, y - 1, '8'); }
    else if (r < 0.7) { set(x0 + Math.floor(w / 2), y - 3, '?'); }
    if (rng() < 0.1 && n > 1) { for (let x = x0; x < x0 + w; x++) set(x, y - 1, '$'); }
    y -= 3; side = 1 - side; n++;
  }
  for (let x = 1; x < W - 1; x++) set(x, 5, '-'); for (let x = 7; x < 13; x++) set(x, 4, 'X'); set(9, 2, 'u'); set(10, 2, 'u'); set(9, 3, '|'); set(10, 3, '|'); set(3, 4, 'b'); set(15, 4, 'b'); set(5, 2, 'b'); set(13, 2, 'b');
  set(2, height - 4, 'P');
  return { map: rows, ents };
}

class Level {
  constructor(def) {

    // main room

    // bonus rooms: k-th bonus pipe → BONUS[bonuses[k]]
    (def.bonuses || []).forEach((name, k) => { const b = BONUS[name]; this.addRoom('bonus' + k, Object.assign({}, b, { kind: name, theme: name === 'warp' ? 'w5' : def.theme })); });
    if (def.sec2) this.addRoom('sec2', Object.assign({}, def.sec2, { fallDeath: true }));
    if (def.maze) this.addRoom('maze', def.maze);
    if (def.tower) this.addRoom('tower', Object.assign({}, def.tower, { theme: def.theme }));
    if (def.boss) this.addRoom('boss', Object.assign({}, def.boss, { theme: def.boss.theme || def.theme }));

  }
  addRoom(id, rdef) { const r = new Room(this, id, rdef); this.rooms[id] = r; return r; }
  // tag pipes in a room: rdef.pipeTags (handmade) or pipePlan (assembled)
  tagPipes(room) {
    const d = room.def; const pipes = room.pipes; const byTag = {};
    if (d.pipePlan && d.pipePlan.length) {
      for (const plan of d.pipePlan) { const ps = pipes.filter(p => p.tx >= plan.x0 && p.tx < plan.x1 && p.linked).sort((a, b) => a.x - b.x); plan.tags.forEach((t, i) => { if (ps[i]) { ps[i].tag = t; byTag[t] = byTag[t] || []; byTag[t].push(ps[i]); } }); }
    }
    if (d.pipeTags) { const linked = pipes.filter(p => p.linked).sort((a, b) => a.x - b.x || a.y - b.y); d.pipeTags.forEach((t, i) => { if (linked[i]) { linked[i].tag = t; byTag[t] = byTag[t] || []; byTag[t].push(linked[i]); } }); }
    room.byTag = byTag; return byTag;
  }
  linkPipes() {
    for (const id in this.rooms) this.tagPipes(this.rooms[id]);
    const link = (a, b) => { if (!a || !b) return; a.to = { room: b.roomId, pipe: b }; };
    for (const id in this.rooms) { const r = this.rooms[id]; for (const p of r.pipes) p.roomId = id; }
    const first = (room, tag) => room && room.byTag[tag] && room.byTag[tag][0];
    const nth = (room, tag, k) => room && room.byTag[tag] && room.byTag[tag][k];
    // bonus rooms (main + sec2 both may have bIn pipes; enumerate globally)
    let k = 0; const seq = ['main', 'sec2'];
    for (const rid of seq) { const r = this.rooms[rid]; if (!r) continue; const ins = r.byTag.bIn || [], outs = r.byTag.bOut || []; ins.forEach((pin, i) => { const b = this.rooms['bonus' + k]; if (b) { link(pin, first(b, 'in')); link(first(b, 'out'), outs[i] || pin); if (b.def.kind === 'warp') { ['w5', 'w6', 'w8'].forEach(w => { const wp = first(b, w); if (wp) wp.to = { warp: +w.slice(1) }; }); } } k++; }); }
    // boss pipe
    for (const rid of ['main', 'sec2', 'tower']) { const r = this.rooms[rid]; if (!r) continue; const tb = first(r, 'toBoss'); if (tb && this.rooms.boss) { link(tb, first(this.rooms.boss, 'in')); } const tn = first(r, 'toNext'); if (tn) { const nx = this.rooms.tower || this.rooms.sec2; if (nx) { const target = first(nx, 'secIn') || first(nx, 'in'); if (target) link(tn, target); else tn.to = { room: nx.id, spawn: true }; } } }
    // L2 boss return pipe → back to main boss pipe
    if (this.rooms.boss && this.rooms.boss.byTag.ret) link(first(this.rooms.boss, 'ret'), first(this.rooms.main, 'toBoss'));
    // L5 maze links: 4 pipes mzA..mzD: third from left (mzC) → sec2 secIn; others → maze 'in' (dead end), maze 'out' → back to main mzA
    if (this.mazeLinks) { const m = this.rooms.main; const maze = this.rooms.maze, sec = this.rooms.sec2; ['mzA', 'mzB', 'mzD'].forEach(t => link(first(m, t), first(maze, 'in'))); link(first(m, 'mzC'), first(sec, 'secIn')); link(first(maze, 'out'), first(m, 'mzA')); }
    // tower: kill 'in' if unused
  }
  get spawnRoom() { return this.rooms.main; }

const HubPause = { menu: null, open() { this.menu = new Menu([{ label: 'Weiter', action: () => UI.close() }, { label: 'Optionen', action: () => UI.open(OptionsScreen) }, { label: 'Steuerung', action: () => UI.open(ControlsScreen) }, { label: 'Zum Titel (speichert)', action: () => { Game.saveProgress(); UI.closeAll(); Game.level = null; Game.state = 'title'; UI.open(TitleScreen, true); } }], { onBack: () => UI.close() }); }, update() { this.menu.update(); if (Input.was('pause') && this.menu.t > 4) UI.close(); }, draw(g) { dim(g, 0.6); box(g, VW / 2 - 70, 60, 140, 80, '#1a1a22', '#9146ff'); Font.draw(g, 'PAUSE', VW / 2, 66, '#bf94ff', { align: 'center' }); this.menu.draw(g, VW / 2 - 50, 80, 100, 12); } };
const _origUpdate = Game.update.bind(Game);
Game.update = function () { if (this.state === 'hub' && !UI.top && !this.transition && !MarxOracle.open && Input.was('pause')) { UI.open(HubPause, true); Input.endFrame(); return; } _origUpdate(); };
/* ======================= BOOTSTRAP / LOOP ======================= */
(function boot() {
  const canvas = document.getElementById('game'); canvas.width = TW; canvas.height = VH; const g = canvas.getContext('2d'); g.imageSmoothingEnabled = false;
  const fit = () => { const sx = Math.floor(window.innerWidth / TW), sy = Math.floor((window.innerHeight - 22) / VH); let s = Math.max(1, Math.min(sx, sy)); if (Save.opt && Save.opt.scale) s = Save.opt.scale; canvas.style.width = TW * s + 'px'; canvas.style.height = VH * s + 'px'; };
  window.addEventListener('resize', fit);
  Game.init(); fit();
  let last = performance.now(), acc = 0; const STEP = 1000 / 60;
  function loop(now) {
    let dt = now - last; last = now; if (dt > 100) dt = 100; acc += dt;
    let steps = 0; while (acc >= STEP && steps < 4) { try { Game.update(); } catch (e) { console.error(e); Game.lastError = e; } Input.endFrame(); acc -= STEP; steps++; }
    try { Game.draw(g); } catch (e) { console.error(e); Game.lastError = e; }
    if (Game.lastError) { g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillRect(0, VH - 20, TW, 20); Font.draw(g, 'Fehler: ' + String(Game.lastError.message).slice(0, 60), 4, VH - 14, '#e03a3a'); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.Game = Game; window.UI = UI; window.UI_NAMES = { TitleScreen, SlotScreen, OptionsScreen, ControlsScreen, CreditsScreen, ScenePlayer, IntroCard, ResultsCard, GameOverScreen, PauseMenu, SpaetiShop, WorldMap, PerkShop, FridgeMenu, VodScreen, HubPause };
})();
